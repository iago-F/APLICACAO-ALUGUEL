{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <style>
    /* Fundo da tela */
    body {
      background-color: #eceff8; /* cor de fundo */
      margin: 0;
      padding: 0;
    }

    /* Barra lateral fixa com fundo branco */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100px;
      height: 100vh;
      overflow-y: auto;
      z-index: 999;
      background-color: #fff;
    }
    .sidebar a.nav-link:first-of-type {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    .sidebar a {
      padding: 15px 10px;
      text-decoration: none;
      font-size: 13px;
      color: black;
      display: block;
      transition: background-color 0.3s ease;
    }
    .sidebar a:hover {
      background-color: #add8e6;
    }
    .icon-text {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-text svg {
      margin-bottom: 5px;
    }
    .nav-text {
      display: block;
      font-size: 14px;
    }
    .LogoPrincipal {
      display: block;
      width: 80px;
      height: auto;
    }

    /* Container do card */
    .container-casa {
      margin-top: 150px; /* Ajuste se houver navbar fixo */
    }

    /* Card branco */
   /* Card maior e com mais padding */
    .card-casa {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 40px;       /* Aumenta o espaçamento interno */
      max-width: 900px;    /* Largura máxima maior do card */
      margin: 0 auto;
    }
    .card-casa h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;    /* Se quiser maior título */
    }

    /* Inputs maiores */
    .form-control {
      margin-bottom: 20px;  /* Mais espaço entre inputs */
      height: 70px;         /* Altura maior */
      font-size: 18px;      /* Fonte maior */
    }

    .btn-cadastrar {
      width: 100%;
      font-size: 1.2rem;     /* Botão um pouco maior */
      font-weight: 700;
      background-color: #ff7f00;
      border: none;
      border-radius: 0.375rem;
      padding: 0.75rem;
      color: #fff;
    }
    .btn-cadastrar:hover {
      background-color: #e36f00;
    }

    .btn-cadastrar:hover {
      background-color: #e36f00;
    }

    /* Preview de imagem */
    #imagePreview img {
      max-width: 100%;
      height: auto;
      display: none;
      margin-top: 10px;
    }
  </style>

  <script>
    function toggleDropdown() {
      const boxUsuario = document.getElementById('box-usuario')
      boxUsuario.classList.toggle('active')
    }

    window.onclick = function (event) {
      const boxUsuario = document.getElementById('box-usuario')
      if (!event.target.matches('.botao-usuario') && !boxUsuario.contains(event.target)) {
        boxUsuario.classList.remove('active')
      }
    }

    function previewImage() {
      const input = document.getElementById('fileInput')
      const previewContainer = document.getElementById('imagePreview')
      const previewImage = previewContainer.querySelector('img')
      const file = input.files[0]

      if (file) {
        const reader = new FileReader()
        reader.onload = function (e) {
          previewImage.src = e.target.result
          previewImage.style.display = 'block'
        }
        reader.readAsDataURL(file)
      } else {
        previewImage.style.display = 'none'
      }
    }
  </script>
</head>

<body>

  <!-- SIDEBAR LATERAL FIXA -->
  <!-- SIDEBAR LATERAL FIXA -->
<div class="sidebar">
    <!-- Primeiro ícone (colado ao topo) -->
    <a class="nav-link" href="{% url 'HomePage' %}">
        <div class="icon-text">
            <img src="{% static 'clientes/images/LOGO_CASA_PRINCIPAL.png' %}"
                 class="LogoPrincipal"/>
            <span class="nav-text">Home</span>
        </div>
    </a>

    <!-- Demais ícones/links -->
    <a href="{% url 'cadastroCasa' %}">
        <div class="icon-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                 class="bi bi-house-add" viewBox="0 0 16 16">
                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h4a.5.5 0 1 0 0-1h-4a.5.5 0 0 1-.5-.5V7.207l5-5 6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0m-3.5-2a.5.5 0 0 0-.5.5v1h-1a.5.5 0 0 0 0 1h1v1a.5.5 0 1 0 1 0v-1h1a.5.5 0 1 0 0-1h-1v-1a.5.5 0 0 0-.5-.5"/>
            </svg>
            <span class="nav-text">Cadastrar Casas</span>
        </div>
    </a>
    <a href="{% url 'casas_reservadas' %}">
        <div class="icon-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                 class="bi bi-calendar-check" viewBox="0 0 16 16">
                <path d="M10.854 7.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 9.793l2.646-2.647a.5.5 0 0 1 .708 0"/>
                <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
            </svg>
            <span class="nav-text">Minhas Reservas</span>
        </div>
    </a>
    <a href="{% url 'casas_do_usuario' %}">
        <div class="icon-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                 class="bi bi-house-check" viewBox="0 0 16 16">
                <path d="M7.293 1.5a1 1 0 0 1 1.414 0L11 3.793V2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v3.293l2.354 2.353a.5.5 0 0 1-.708.708L8 2.207l-5 5V13.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 2 13.5V8.207l-.646.647a.5.5 0 1 1-.708-.708z"/>
                <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m1.679-4.493-1.335 2.226a.75.75 0 0 1-1.174.144l-.774-.773a.5.5 0 0 1 .708-.707l.547.547 1.17-1.951a.5.5 0 1 1 .858.514"/>
            </svg>
            <span class="nav-text">Minhas Casas</span>
        </div>
    </a>
    <div class="sair_icon">
        <a href="{% url 'logout' %}">
            <div class="icon-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                     class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                          d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                    <path fill-rule="evenodd"
                          d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                </svg>
                <span class="nav-text">Sair</span>
            </div>
        </a>
    </div>
</div>

  <!-- CARD DE CADASTRO -->
  <div class="container-casa">
    <div class="card-casa">
      <h2>CADASTRE SUA CASA</h2>

      <form
        action="{% url 'cadastroCasa' %}"
        method="POST"
        enctype="multipart/form-data"
      >
        {% csrf_token %}

        <!-- 1ª LINHA: Endereço e Quartos -->
        <div class="row">
          <div class="col-md-6">
            <input
              type="text"
              name="endereco"
              placeholder="Endereço"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              name="num_quarto"
              placeholder="Quantidade de Quartos"
              class="form-control"
            />
          </div>
        </div>

        <!-- 2ª LINHA: Banheiros e Área -->
        <div class="row">
          <div class="col-md-6">
            <input
              type="text"
              name="num_banheiro"
              placeholder="Quantidade de Banheiros"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              name="area"
              placeholder="Área (m²)"
              class="form-control"
            />
          </div>
        </div>

        <!-- 3ª LINHA: Descrição e Preço -->
        <div class="row">
          <div class="col-md-6">
            <input
              type="text"
              name="descricao"
              placeholder="Descrição"
              class="form-control"
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              name="preco_total"
              placeholder="Preço Total"
              class="form-control"
            />
          </div>
        </div>

        <!-- LINHA DA IMAGEM (1 col inteira) -->
        <div class="row">
          <div class="col-md-12">
            <label for="fileInput">Selecione uma imagem:</label>
            <input
              type="file"
              class="form-control-file"
              id="fileInput"
              name="image"
              accept="image/*"
              onchange="previewImage()"
            />
            <div id="imagePreview">
              <img src="" alt="Preview da Imagem" />
            </div>
          </div>
        </div>

        <!-- BOTÃO -->
        <button type="submit" class="btn-cadastrar mt-3">
          Cadastrar
        </button>
      </form>
    </div>
  </div>

</body>
</html>
